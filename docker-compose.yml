version: '3.8'

services:
  # Database Service: PostgreSQL + PostGIS
  db:
    image: postgis/postgis:15-3.3
    container_name: sentinel_postgis
    environment:
      POSTGRES_DB: sentinel_db
      POSTGRES_USER: sentinel_admin
      POSTGRES_PASSWORD: sentinel_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel_admin -d sentinel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Object Storage: MinIO for Snapshots and Evidence
  minio:
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    container_name: sentinel_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Backend Service: FastAPI + Watchlist Engine + Alerts
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://sentinel_admin:sentinel_secure_password_2026@db:5432/sentinel_db
      - STORAGE_ENDPOINT=http://minio:9000
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

  # Stream Ingestion & AI Pipeline
  ingestion:
    build:
      context: ./ingestion
      dockerfile: Dockerfile
    container_name: sentinel_ingestion
    ports:
      - "8001:8001"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

  # Frontend Service: React Dashboard + GIS Mapping
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
