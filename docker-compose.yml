# SENTINEL — full local stack.
#
#   docker compose up --build          # postgis + minio + backend + frontend
#   docker compose --profile ai up     # ... plus the ingestion/AI pipeline service
#   docker compose down                # stop
#   docker compose down -v             # stop + wipe data volumes
#
# Host ports and the admin password are configurable via a repo-root .env
# (see .env.example). With no .env the backend generates+prints a random
# admin password on first start.

services:
  postgis:
    image: postgis/postgis:15-3.3
    container_name: sentinel-postgis
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./database/init_postgis.sql:/docker-entrypoint-initdb.d/init_postgis.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel}"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    container_name: sentinel-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    container_name: sentinel-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel}@postgis:5432/${POSTGRES_DB:-sentinel}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      INGEST_API_KEY: ${INGEST_API_KEY:-dev-ingest-key}
      INGEST_AUTO_ONBOARD_CAMERAS: "true"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sentinel.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Seed a demo watchlist hit on first start so the mock ANPR demo lights
      # up end to end (GJ18TC0450 is the plate in demo_assets/clips/*.mp4).
      # Idempotent -- re-seeding never duplicates. Set to an empty string in
      # .env for a clean deployment with no demo data.
      SEED_WATCHLIST_PLATE: ${SEED_WATCHLIST_PLATE-GJ18TC0450}
      SEED_WATCHLIST_CATEGORY: ${SEED_WATCHLIST_CATEGORY:-Stolen Vehicle (demo)}
      # Phase 12: seed the AI demo dataset (cameras + GJ18TC0450 journey +
      # incident/case + a stopped-vehicle anomaly) so the AI features work
      # from `docker compose up` with no live CCTV. Set to 0 for a clean
      # deployment. Idempotent.
      SEED_AI_DEMO: ${SEED_AI_DEMO:-1}
      AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-deterministic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # The dashboard reaches the API same-origin through the Vite dev proxy
      # (frontend service, :3000), so this only needs the dev host origin.
      # Override with a real https origin (or a comma-free JSON list) in a
      # non-local deployment -- never "*" outside development (the backend
      # drops a "*" when ENV is not a development value anyway).
      ENV: ${SENTINEL_ENV:-development}
      # JSON array (pydantic-settings parses list fields as JSON). The YAML
      # single-quote wrapper is the string delimiter -- the value itself must
      # NOT contain quotes. Override with e.g.
      # CORS_ALLOW_ORIGINS='["https://ops.example.gov"]' in .env.
      CORS_ALLOW_ORIGINS: '${CORS_ALLOW_ORIGINS:-["http://localhost:3000"]}'
      VEHICLE_EVENT_RETENTION_DAYS: ${VEHICLE_EVENT_RETENTION_DAYS:-30}
      UVICORN_RELOAD: ${UVICORN_RELOAD:-1}
      # Read-only access to the local mock-camera source clips, so
      # GET /api/v1/cameras/{id}/mock-video can actually stream them (see
      # DEVELOPER_README.md "Mock Cameras"). Mounted at a fixed container
      # path rather than the host's literal absolute path -- the backend
      # translates data/trafficdataset_camera_registry.json's host paths
      # against MOCK_VIDEOS_ROOT, so this stays portable across machines.
      MOCK_VIDEOS_ROOT: /trafficdataset
      # Committed H.264 demo clips (demo_assets/clips/*.mp4) -- lets
      # GET /api/v1/cameras/{id}/mock-video stream the mockcam0N clips.
      DEMO_ASSETS_ROOT: /demo_assets
      # Read-only access to the AI pipeline's local evidence snapshots, as a
      # fallback for the (rare) event whose snapshot was never uploaded to
      # MinIO -- see vehicles.py get_evidence() / EVIDENCE_ROOT.
      EVIDENCE_ROOT: /evidence
    depends_on:
      postgis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./database:/database:ro
      - ./scripts:/scripts:ro
      - ./trafficdataset:/trafficdataset:ro
      - ./demo_assets:/demo_assets:ro
      - ./evidence:/evidence:ro

  frontend:
    image: node:20-alpine
    container_name: sentinel-frontend
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 3000"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    container_name: sentinel-pipeline
    profiles: ["ai"]
    # Default: the real Sentinel cameras (data/camera_registry.json, cam04/cam06).
    # Mock ANPR demo: set PIPELINE_REGISTRY=data/demo_camera_registry.json and
    # PIPELINE_CAMERAS=mockcam01,mockcam02,mockcam03 in .env -- the committed
    # H.264 clips under demo_assets/clips/ are mounted read-only below.
    # See DEMO_RUNBOOK.md.
    command: ["--cameras", "${PIPELINE_CAMERAS:-cam04,cam06}",
              "--registry", "${PIPELINE_REGISTRY:-data/camera_registry.json}",
              "--backend-url", "http://backend:8000/api/v1/events/ai-detection"]
    environment:
      SENTINEL_INGEST_API_KEY: ${INGEST_API_KEY:-dev-ingest-key}
      SENTINEL_RTSP_USERNAME: ${SENTINEL_RTSP_USERNAME:-}
      SENTINEL_RTSP_PASSWORD: ${SENTINEL_RTSP_PASSWORD:-}
      SENTINEL_RTSP_BASE: ${SENTINEL_RTSP_BASE:-rtsp://103.250.160.189:8554/stream}
      SENTINEL_SEND_SNAPSHOT: "1"
      OCR_ENGINE: ${OCR_ENGINE:-easyocr}
      ADMIN_USER: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      # Registries + committed demo clips, read-only. demo_assets/clips/*.mp4
      # and data/demo_camera_registry.json are in the repo; ./trafficdataset
      # is the optional (git-ignored, machine-local) MOCK_CAM* dataset -- an
      # empty dir here is harmless when it isn't present.
      - ./data:/repo/data:ro
      - ./demo_assets:/repo/demo_assets:ro
      - ./trafficdataset:/repo/trafficdataset:ro
    depends_on:
      - backend

  # Live Camera & AI page (compose profile "ai") -- exactly ONE real RTSP
  # camera (CAM_AHM_001 by default). Isolated from the `pipeline` service
  # above: it owns its own single camera connection and serves MJPEG +
  # status directly to the new frontend page (frontend/src/pages/
  # LiveCameraAIPage.jsx), it does not touch the Camera registry/DB.
  live-camera-ai:
    build:
      context: .
      dockerfile: Dockerfile.live-camera-ai
    container_name: sentinel-live-camera-ai
    profiles: ["ai"]
    environment:
      LIVE_CAMERA_ID: ${LIVE_CAMERA_ID:-CAM_AHM_001}
      # Blank -> the page honestly shows OFFLINE, never a fake stream.
      LIVE_CAMERA_RTSP_URL: ${LIVE_CAMERA_RTSP_URL:-}
      LIVE_CAMERA_HTTP_PORT: ${LIVE_CAMERA_HTTP_PORT:-8600}
      LIVE_CAMERA_CORS_ORIGINS: '${LIVE_CAMERA_CORS_ORIGINS:-["http://localhost:3000","http://localhost:5173"]}'
      SENTINEL_RTSP_USERNAME: ${SENTINEL_RTSP_USERNAME:-}
      SENTINEL_RTSP_PASSWORD: ${SENTINEL_RTSP_PASSWORD:-}
    ports:
      - "${LIVE_CAMERA_HTTP_PORT:-8600}:8600"

volumes:
  postgis_data:
  minio_data:
  frontend_node_modules:
